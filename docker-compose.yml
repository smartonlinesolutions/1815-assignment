name: havenpost

# Local development only: the passwords and salts below are throw-away defaults.
# Override them in a .env file next to this one (see .env.example).
x-wp-salts: &wp-salts
  AUTH_KEY: ${WP_SALT:-local-dev-only-change-me}
  SECURE_AUTH_KEY: ${WP_SALT:-local-dev-only-change-me}
  LOGGED_IN_KEY: ${WP_SALT:-local-dev-only-change-me}
  NONCE_KEY: ${WP_SALT:-local-dev-only-change-me}
  AUTH_SALT: ${WP_SALT:-local-dev-only-change-me}
  SECURE_AUTH_SALT: ${WP_SALT:-local-dev-only-change-me}
  LOGGED_IN_SALT: ${WP_SALT:-local-dev-only-change-me}
  NONCE_SALT: ${WP_SALT:-local-dev-only-change-me}

services:
  php:
    build:
      context: ./docker/php
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    working_dir: /var/www/app
    volumes:
      - ./app:/var/www/app
    environment:
      <<: *wp-salts
      WP_ENV: development
      WP_HOME: http://localhost:${WEB_PORT:-8080}
      WP_SITEURL: http://localhost:${WEB_PORT:-8080}/wp
      DB_HOST: db
      DB_NAME: wordpress
      DB_USER: wordpress
      DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WP_TITLE: ${WP_TITLE:-Havenpost}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      HAVENPOST_SUBSCRIPTION_COOKIE: havenpost_token
      HAVENPOST_DEV_SUBSCRIBER_TOKEN: dev-subscriber   # only honoured when WP_ENV is development/local
      HAVENPOST_SUBSCRIPTION_API_URL: ""               # real validation endpoint, see SubscriptionChecker
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db_data:
